[package]
name = "chain-agnostic-service"
version = "0.1.0"
edition = "2024"

[lints.clippy]
let_and_return = "warn"
uninlined_format_args = "warn"
unnecessary_debug_formatting = "warn"
unwrap_used = "deny"
useless_let_if_seq = "warn"
wildcard_imports = "warn"
module_inception = "allow"


[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
espresso-types = { git = "https://github.com/EspressoSystems/espresso-network.git" }
committable = { git = "https://github.com/EspressoSystems/commit.git" }
hotshot-types = { git = "https://github.com/EspressoSystems/espresso-network.git" }
alloy = { version = "1.6.3", default-features = false, features = ["sol-types", "serde", "rlp"] }
alloy-rlp = { version = "0.3.13", features = ["derive"] }
anyhow = "1.0.101"
tokio = { version = "1.49.0", features = ["time", "macros", "rt-multi-thread", "sync", "net"] }
base64 = "0.22.1"
serde_bytes = "0.11.19"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22",  features = ["fmt", "json"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
thiserror = "2.0.18"
brotli = "7"
bytes = "1.11.0"
http = "1"
yawc = "0.3"
futures = "0.3"
url = "2"
tokio-util = { version = "0.7", features = ["codec"] }
rand = "0.9"
serde_with = { version = "3.17.0", features = ["base64"] }
