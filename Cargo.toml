[package]
name = "chain-adjacent-service"
version = "0.1.0"
edition = "2024"

[features]
default = ["nitro-v3_9_9"]
e2e = []
nitro-v3_9_9 = []
nitro-v3_10 = []

[lib]
name = "chain_adjacent_service"
path = "src/lib.rs"

[[test]]
name = "nitro"
path = "tests/nitro/main.rs"
required-features = ["e2e"]

[lints.clippy]
let_and_return = "warn"
uninlined_format_args = "warn"
unnecessary_debug_formatting = "warn"
unwrap_used = "deny"
useless_let_if_seq = "warn"
wildcard_imports = "warn"
module_inception = "allow"

[dependencies]
hex = "0.4.3"
alloy = { version = "2.0.5", default-features = false, features = [
    "sol-types",
    "serde",
    "rlp",
    "rpc-types",
    "provider-http",
    "provider-ws",
    "pubsub",
    "contract",
    "signer-local",
    "json-rpc",
    "reqwest",
] }
async-http-proxy = { version = "1.2", features = ["runtime-tokio"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots", "connect"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "0.26"
alloy-rlp = { version = "0.3.13", features = ["derive"] }
anyhow = "1.0.101"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-nitro-enclaves-nsm-api = "0.4"
aws-sdk-secretsmanager = "1"
async-trait = "0.1.89"
axum = "0.8.8"
base64 = "0.22.1"
brotli = "7"
bytes = "1.11.0"
committable = { git = "https://github.com/EspressoSystems/commit.git" }
clap = { version = "4", features = ["derive", "env"] }
espresso-types = { git = "https://github.com/EspressoSystems/espresso-network.git", rev = "39ec3aa736" }
futures = "0.3"
hotshot-types = { git = "https://github.com/EspressoSystems/espresso-network.git", rev = "39ec3aa736" }
light-client = { git = "https://github.com/EspressoSystems/espresso-network.git", rev = "39ec3aa736" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonrpsee = { version = "0.26.0", features = [
    "macros",
    "http-client",
    "async-client",
    "server",
    "jsonrpsee-core",
] }
rand = "0.9"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = { version = "1.0.145", features = ["raw_value"] }
serde_with = { version = "3.17.0", features = ["base64"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = [
    "time",
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "json"] }
url = "2"
yawc = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
parking_lot = "0.12.5"

[dev-dependencies]
dotenvy = "0.15"
wiremock = "0.6.5"
k256 = { version = "0.13", features = ["ecdsa"] }
secp256k1 = { version = "0.31", features = ["recovery"] }
