name: CAS CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  clippy_check:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # nitro-v3_9_9 and nitro-v3_10 are mutually exclusive features, so
      # --all-features fails the compile_error!. Run once per protocol version.
      - name: Run Clippy (Nitro v3.9.9)
        run: cargo clippy --all-targets --no-default-features --features e2e,nitro-v3_9_9
      - name: Run Clippy (Nitro v3.10)
        run: cargo clippy --all-targets --no-default-features --features e2e,nitro-v3_10

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # audit-check only builds cargo-audit from source when it is not already on
      # PATH, and that build uses the toolchain rust-toolchain.toml pins for this
      # repo. cargo-audit's dependencies raise their MSRV freely, so that build
      # breaks whenever they outrun our pin. Drop in the prebuilt binary instead:
      # the audit only reads Cargo.lock, so it has no reason to track our pin.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
