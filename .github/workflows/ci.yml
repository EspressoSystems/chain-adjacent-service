name: CAS CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  backport_workflow:
    name: Backport workflow tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/tests/backport.test.cjs

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Tests (${{ matrix.nitro-feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nitro-feature: [nitro-v3_9_9, nitro-v3_10, nitro-v3_12_1]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets --no-default-features --features ${{ matrix.nitro-feature }} -- --test-threads=1

  clippy_check:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Nitro version features are mutually exclusive.
      - name: Run Clippy (Nitro v3.9.9)
        run: cargo clippy --locked --all-targets --no-default-features --features e2e,nitro-v3_9_9
      - name: Run Clippy (Nitro v3.10)
        run: cargo clippy --locked --all-targets --no-default-features --features e2e,nitro-v3_10
      - name: Run Clippy (Nitro v3.12.1)
        run: cargo clippy --locked --all-targets --no-default-features --features e2e,nitro-v3_12_1

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # audit-check only builds cargo-audit from source when it is not already on
      # PATH, and that build uses the toolchain rust-toolchain.toml pins for this
      # repo. cargo-audit's dependencies raise their MSRV freely, so that build
      # breaks whenever they outrun our pin. Drop in the prebuilt binary instead:
      # the audit only reads Cargo.lock, so it has no reason to track our pin.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
