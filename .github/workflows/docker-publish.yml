name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        nitro:
          # Verified (trustless) builds — the default production path. Every Espresso
          # block is checked against consensus via the light client.
          - feature: nitro-v3_9_9
            cache_key: nitro-v3_9_9
            suffix: "-v3_9_9"
            latest: "auto"
          - feature: nitro-v3_10
            cache_key: nitro-v3_10
            suffix: "-v3_10"
            latest: "false"
          # Unverified-reader builds — distinct binary/PCR0, separately attested. The
          # deliberate production fallback for when the light client is unavailable and
          # the chain must keep moving (reads the query node without consensus checks).
          # cache_key is comma-free: buildx cache refs treat commas as attribute
          # separators, so the feature string itself can't be used in the ref.
          - feature: nitro-v3_9_9,unverified-reader
            cache_key: nitro-v3_9_9-unverified
            suffix: "-v3_9_9-unverified"
            latest: "false"
          - feature: nitro-v3_10,unverified-reader
            cache_key: nitro-v3_10-unverified
            suffix: "-v3_10-unverified"
            latest: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ matrix.nitro.latest }}
            suffix=${{ matrix.nitro.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CARGO_FEATURES=${{ matrix.nitro.feature }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.nitro.cache_key }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-nitro-v3_9_9
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.nitro.cache_key }},mode=max,image-manifest=true,oci-mediatypes=true
