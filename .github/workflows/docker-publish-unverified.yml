name: Docker Publish (unverified-reader)

# The unverified-reader images read Espresso WITHOUT consensus verification — a distinct
# binary/PCR0, a deliberate separately-attested production fallback for when the light client
# is unavailable. They are NOT the default path, so they build only on manual dispatch.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # cache_key is comma-free (buildx cache refs split on commas).
        nitro:
          - feature: nitro-v3_9_9,unverified-reader
            cache_key: nitro-v3_9_9-unverified
            suffix: "-v3_9_9-unverified"
          - feature: nitro-v3_10,unverified-reader
            cache_key: nitro-v3_10-unverified
            suffix: "-v3_10-unverified"

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.nitro.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CARGO_FEATURES=${{ matrix.nitro.feature }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Warm from this variant's own cache, then the canonical verified v3_9_9 base
          # (built on every main push, so it stays fresh).
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.nitro.cache_key }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-nitro-v3_9_9
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.nitro.cache_key }},mode=max,image-manifest=true,oci-mediatypes=true
