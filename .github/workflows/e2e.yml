name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore L1 deployment state cache
        uses: actions/cache@v4
        with:
          path: |
            e2e/nitro/generated-config/l1-state.json
            e2e/nitro/generated-config/deployment.json
            e2e/nitro/generated-config/deployed_chain_info.json
          key: l1-deploy-${{ hashFiles('e2e/nitro/nitro-config/l2_chain_config.json', 'e2e/nitro/docker-compose.yml') }}

      - name: Pull Docker images
        working-directory: e2e/nitro
        run: |
          source .env
          docker pull "$NITRO_IMAGE"
          docker pull "$ESPRESSO_DEV_NODE_IMAGE"
          docker pull ghcr.io/espressosystems/rollup-creator:63429ba
          docker pull ghcr.io/foundry-rs/foundry:latest
          docker pull ghcr.io/foundry-rs/foundry:v1.5.1

      - uses: extractions/setup-just@v3

      - name: Run E2E tests
        run: just test-e2e
