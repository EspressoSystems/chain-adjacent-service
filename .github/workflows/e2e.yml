          docker pull ghcr.io/foundry-rs/foundry:latest &
          docker pull ghcr.io/foundry-rs/foundry:v1.5.1 &
          wait

      - uses: extractions/setup-just@v3

      - name: Run non-DA E2E tests
        run: just test-e2e-non-da

      - name: Cleanup Docker
        if: always()
        run: just e2e-down

  e2e-v3_10-da:
    name: E2E Tests (Nitro v3.10, DA)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

