services:
  espresso-dev-node:
    # TODO: switch to a registry tag once PR #4453 (enable light-client module in dev node)
    # merges, e.g. ghcr.io/espressosystems/espresso-network/espresso-dev-node:main.
    # For now this is the locally-loaded PR build artifact, which serves /light-client.
    image: ghcr.io/espressosystems/espresso-network/espresso-dev-node:pr-4453
    platform: linux/amd64
    ports:
      - "$ESPRESSO_SEQUENCER_API_PORT:$ESPRESSO_SEQUENCER_API_PORT"
      - "$ESPRESSO_BUILDER_PORT:$ESPRESSO_BUILDER_PORT"
      - "$ESPRESSO_DEV_NODE_PORT:$ESPRESSO_DEV_NODE_PORT"
    env_file:
      - .env
    environment:
      - ESPRESSO_BUILDER_PORT
      - ESPRESSO_DEPLOYER_ACCOUNT_INDEX
      - ESPRESSO_DEV_NODE_PORT
      - ESPRESSO_SEQUENCER_API_PORT
      # Newer dev-node image (post repo-rename) serves its API on ESPRESSO_NODE_API_PORT
      # (default 8770); pin it to the port CAS expects.
      - ESPRESSO_NODE_API_PORT=$ESPRESSO_SEQUENCER_API_PORT
      - ESPRESSO_SEQUENCER_ETH_MNEMONIC
      - ESPRESSO_SEQUENCER_L1_PROVIDER
      - ESPRESSO_SEQUENCER_DATABASE_MAX_CONNECTIONS=25
      - ESPRESSO_DEV_NODE_EPOCH_HEIGHT
      - ESPRESSO_SEQUENCER_STORAGE_PATH=/data/espresso
      - ESPRESSO_DEV_NODE_L1_DEPLOYMENT=skip
      - ESPRESSO_SEQUENCER_LIGHT_CLIENT_PROXY_ADDRESS=0x0f1f89aaf1c6fdb7ff9d361e4388f5f3997f12a8
      - ESPRESSO_SEQUENCER_STAKE_TABLE_ADDRESS=0x63e6dde6763c3466c7b45be880f7ee5dc2ca3e25
      - ESPRESSO_SEQUENCER_STAKE_TABLE_PROXY_ADDRESS=0x9f5eac3d8e082f47631f1551f1343f23cd427162
      - RUST_LOG=WARN
      - RUST_LOG_FORMAT
      - ESPRESSO_DEV_NODE_VERSION=0.4
